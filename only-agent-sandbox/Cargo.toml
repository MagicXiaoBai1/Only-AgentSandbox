[package]
name = "oas-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { workspace = true }
tonic = { workspace = true }
tokio-stream = { workspace = true }
async-stream = { workspace = true }
oas-cri = { path = "crates/oas-cri" }
oas-manager = { path = "crates/oas-manager" }

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "1"
tonic = "0.14.6"
tonic-prost = "0.14.6"
prost = "0.14.4"
tonic-build = "0.14.6"
tonic-prost-build = "0.14.6"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = "0.1"
async-stream = "0.3"
